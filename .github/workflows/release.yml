name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.201
      - name: Validate tag and package versions
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch origin main --no-tags
          ./eng/validate-release.sh "$RELEASE_TAG" origin/main
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Build
        run: dotnet build ProMvvm.slnx -c Release
      - name: Test runtime
        run: dotnet test tests/ProMvvm.Tests -c Release --no-build
      - name: Test source generators
        run: dotnet test tests/ProMvvm.SourceGenerators.Tests -c Release --no-build
      - name: Test integration
        run: dotnet test tests/ProMvvm.IntegrationTests -c Release --no-build
      - name: Test ReactiveUI core integration
        run: dotnet test tests/ProMvvm.ReactiveUiCoreIntegrationTests -c Release --no-build
      - name: Pack source generators
        run: >-
          dotnet pack src/ProMvvm.SourceGenerators -c Release --no-build
          -o artifacts/packages
      - name: Pack runtime
        run: >-
          dotnet pack src/ProMvvm -c Release --no-build
          -o artifacts/packages
      - name: Validate package contents
        run: ./eng/validate-packages.sh "${{ steps.release.outputs.version }}"
      - name: Test all package and framework integrations
        run: >-
          ./eng/run-package-integrations.sh
          artifacts/packages
          "${{ steps.release.outputs.version }}"
      - name: Generate checksums
        working-directory: artifacts/packages
        run: sha256sum -- ./*.nupkg ./*.snupkg > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages-${{ steps.release.outputs.version }}
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 7

  publish-nuget:
    name: Publish to NuGet.org
    needs: validate
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.201
      - uses: actions/download-artifact@v8
        with:
          name: release-packages-${{ needs.validate.outputs.version }}
          path: artifacts/packages
      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "The NUGET_API_KEY environment secret is not configured." >&2
            exit 1
          fi
          dotnet nuget push "artifacts/packages/ProMvvm.SourceGenerators.$RELEASE_VERSION.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/ProMvvm.$RELEASE_VERSION.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  publish-github:
    name: Publish GitHub release
    needs: [validate, publish-nuget]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-packages-${{ needs.validate.outputs.version }}
          path: artifacts/packages
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          release_options=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "ProMvvm $RELEASE_VERSION"
          )
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            artifacts/packages/* \
            "${release_options[@]}"
